<!-- Custom fonts — loaded via Google Fonts
     Keep this in sync with $global-font-family in assets/css/main.scss.
     To switch fonts: change the `family=` parameter in the href below AND
     update the font name in main.scss. -->

<!-- Current font: Inter (clean, modern, reads well at small sizes) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet">

<!-- Other options — swap the href above for any of these:
  Source Sans 3 (warm, very readable, academic feel):
    family=Source+Sans+3:wght@400;600;700

  Nunito (rounded, friendly, good for students):
    family=Nunito:wght@400;600;700

  IBM Plex Sans (technical, structured):
    family=IBM+Plex+Sans:wght@400;500;600;700
-->

{% if page.math %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
