<!-- Body font: Source Sans 3, self-hosted from assets/fonts/ (see the
     @font-face rules in assets/css/main.scss). Preloading the upright face
     means it's normally ready before the first paint, so pages don't render
     in a system font and then jump when the web font arrives.

     To switch fonts: download the new woff2 file(s) into assets/fonts/,
     update the @font-face rules in main.scss, the --font-body token in
     _sass/theme/_tokens.scss, and the preload href below. Candidates that
     suit the site: Nunito (rounded, friendly), IBM Plex Sans (technical). -->
<link rel="preload" href="{{ '/assets/fonts/source-sans-3-latin.woff2' | relative_url }}"
      as="font" type="font/woff2" crossorigin>

{% if page.math %}
    <script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    // Adds keyboard-navigable, speech-text exploration of expressions for screen readers.
    loader: {
      load: ['a11y/explorer']
    }
  };
    </script>
    <script defer
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
<script defer src="{{ '/assets/js/notebook-links.js' | relative_url }}"></script>
