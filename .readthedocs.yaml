version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
    ruby: "3.3"
  jobs:
    install:
      - python -m pip install --upgrade pip nbconvert nbformat
      - gem install bundler
      - bundle install
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - |
          cat > _config.rtd.generated.yml <<EOF
          title: "ML Curriculum"
          description: "Machine Learning at the Academies of Loudoun"
          url: ""
          baseurl: "/en/${READTHEDOCS_VERSION}"
          EOF
        - python scripts/export_notebooks.py
        - python scripts/generate_notebook_metadata.py
        - bundle exec jekyll build --config _config.yml,_config.rtd.generated.yml --destination "$READTHEDOCS_OUTPUT/html"
